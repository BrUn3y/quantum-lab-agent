[project]
name = "quantum-operations-agent"
version = "1.0.0"
description = "Quantum Operations Agent - Main orchestrator for quantum computing operations"
readme = "README.md"
authors = [{ name = "Edgar Bruney" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "agentstack-sdk==0.4.0rc1",
    "beeai_framework[a2a]>=0.1.76",
    "python-dotenv>=1.0.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[project.scripts]
server = "quantum_operations_agent.agent:run"

[tool.hatchling.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"